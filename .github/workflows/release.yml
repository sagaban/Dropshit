name: Release

# Every push to main (i.e. every merged PR) builds Dropshit.dmg and publishes
# it as a GitHub release. Version = MAJOR.MINOR from scripts/build-dmg.sh plus
# the workflow run number as patch (e.g. 1.5.0 in the script → v1.5.<run>).
# Bump MAJOR.MINOR in the script by hand when you want a new minor line.
#
# Auto-update: when the SPARKLE_PUBLIC_KEY repo variable and the
# SPARKLE_PRIVATE_KEY repo secret are set, the app is built with Sparkle
# enabled and the release also carries a signed appcast.xml, which installed
# copies read from releases/latest/download/appcast.xml. Without them the DMG
# is built with auto-update disabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: |
          base="$(sed -nE 's/^VERSION="\$\{VERSION:-([0-9]+\.[0-9]+)\.[0-9]+\}"$/\1/p' scripts/build-dmg.sh)"
          if [ -z "$base" ]; then
            echo "Could not read base VERSION from scripts/build-dmg.sh" >&2
            exit 1
          fi
          echo "version=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
        run: bash scripts/build-dmg.sh

      - name: Sign update and write appcast
        if: ${{ vars.SPARKLE_PUBLIC_KEY != '' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          # An app built with the public key but released without a feed would
          # point existing installs at a missing appcast, so fail loudly.
          if [ -z "${SPARKLE_PRIVATE_KEY}" ]; then
            echo "SPARKLE_PUBLIC_KEY is set but the SPARKLE_PRIVATE_KEY secret is missing" >&2
            exit 1
          fi
          bash scripts/sign-appcast.sh Dropshit.dmg "${VERSION}" > appcast.xml

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=(Dropshit.dmg)
          [ -f appcast.xml ] && assets+=(appcast.xml)
          gh release create "v${VERSION}" "${assets[@]}" \
            --target "${GITHUB_SHA}" \
            --title "Dropshit v${VERSION}" \
            --generate-notes \
            --notes "First launch (ad-hoc signed, not notarized): \`xattr -dr com.apple.quarantine /Applications/Dropshit.app\`"
